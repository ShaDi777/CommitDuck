name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version\s*=' gradle.properties | cut -d= -f2 | tr -d ' ')
          short_sha=${GITHUB_SHA::7}
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          prerelease=()
          [[ "$version" == *SNAPSHOT* ]] && prerelease=(--prerelease)
          gh release create "$tag" build/distributions/*.zip \
            --target "$GITHUB_SHA" \
            --title "Commit Duck ${version} (build ${GITHUB_RUN_NUMBER}, ${short_sha})" \
            --generate-notes \
            "${prerelease[@]}"
